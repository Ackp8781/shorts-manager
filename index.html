<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ackp's shorts manager</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f3f8;--s:#fff;--fg:#17142a;--m:#6a6684;--l:#e4e1ef;--a:#e8325c;--ai:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e0c16;--s:#161322;--fg:#f1eff9;--m:#9d98b8;--l:#2a2640;--a:#ff5a7e;--ai:#0e0c16;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--a) 18%,transparent),transparent 50%),var(--bg);color:var(--fg);font:15px Figtree,system-ui,sans-serif;padding:16px}
form{background:var(--s);border:1px solid var(--l);border-radius:20px;padding:32px;width:min(380px,100%);display:grid;gap:14px;box-shadow:0 10px 40px rgb(0 0 0 / .12)}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--a),#ff8a3d);display:grid;place-items:center}
.logo svg{width:22px;height:22px;fill:#fff}
h1{margin:0;font:800 26px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}h1 span{color:var(--a)}p{margin:0;color:var(--m)}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button{font:inherit;font-weight:700;background:var(--a);color:var(--ai);border:0;border-radius:12px;padding:12px;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--a);min-height:1.2em;font-size:13px}
</style></head><body>
<form id="f"><div class="logo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
<h1>ackp's <span>shorts</span> manager</h1><p>Enter the password to open.</p>
<input id="pw" type="password" autocomplete="current-password" aria-label="Password" autofocus required>
<button id="go">Unlock</button><div id="err" role="alert"></div></form>

  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
