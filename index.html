<style>
:root{--bg:#f6f5fb;--s:#fff;--fg:#1b1830;--m:#6b6785;--l:#e2dff0;--a:#ff3d68;--ai:#fff}

button{font:inherit;font-weight:600;background:var(--a);color:var(--ai);border:0;border-radius:999px;padding:10px;cursor:pointer}
#err{color:var(--a);min-height:1.2em;font-size:13px}
</style></head><body>

async function unlock(p){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
